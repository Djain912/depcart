name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like DepCart to do?
      description: Describe the problem you're trying to solve and how you'd like it to work.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do this today?
      description: Optional. Any workaround or other tool you use now.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to help build this
